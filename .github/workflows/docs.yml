name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment is switched off while the repo is private (Pages on a
# private repo needs a paid plan). The build still runs so a broken docs site
# fails CI. To publish: make the repo public, set Settings > Pages > Source to
# "GitHub Actions", then uncomment the marked lines below.

permissions:
  contents: read
  # pages: write
  # id-token: write

# One deployment at a time; let an in-progress deploy finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for VitePress lastUpdated timestamps
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # - uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: npm run docs:build
      # - uses: actions/upload-pages-artifact@v4
      #   with:
      #     path: docs/.vitepress/dist

